# OCraft 全栈：PostgreSQL + Nest 后端 + Next 前端
#
# 用法（仓库根目录）：
#   1. cp server/.env.example server/.env   # 填 LLM_* / AUTH_SECRET
#   2. docker compose up --build
#   浏览器：http://localhost:3300  API：http://localhost:4400
#
# 只要数据库（兼容旧习惯）：
#   docker compose up -d postgres
#
# 阿里云生产（子域 ocraft.cspona.top + 宝塔反代）：
#   docker compose -f docker-compose.prod.yml up -d --build
#   详见 docker-compose.prod.yml 头注释

name: ocraft

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocraft-postgres
    environment:
      POSTGRES_USER: ocraft
      POSTGRES_PASSWORD: ocraft
      POSTGRES_DB: ocraft
    ports:
      # 宿主机勿用 5432/5433：Windows Hyper-V 常保留 5358–5457
      # 只绑定回环地址：否则同局域网 / 虚拟局域网（如 Radmin VPN）上的任何设备
      # 都能用下面这个弱口令直连数据库，绕过全部应用逻辑。
      # 确实需要别的设备连库时，再显式改成 '15432:5432' 并收紧系统防火墙。
      - '127.0.0.1:15432:5432'
    volumes:
      - ocraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ocraft -d ocraft']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: ocraft-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 只绑定回环地址，避免服务对局域网开放
      - '127.0.0.1:4400:4400'
    env_file:
      - path: server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4400'
      # 容器内必须监听 0.0.0.0，宿主机的端口映射才能生效；
      # 对外的暴露面由上面的 127.0.0.1 端口绑定 + 系统防火墙控制。
      BIND_HOST: 0.0.0.0
      # 容器内已对 compose 网络开放，因此必须显式声明谁有权改剧情包。
      # 未设置时：剧情包写入 / 删除 / AI 生成接口会被拒绝（对话与只读功能正常）。
      # PACK_ADMIN_IDS: '001'
      # 容器内走 compose 网络，不要用 localhost:15432
      DATABASE_URL: postgresql://ocraft:ocraft@postgres:5432/ocraft
      # 生产域名示例：CLIENT_ORIGIN: https://cspona.top
      CLIENT_ORIGIN: http://localhost:3300
      STORY_PACKS_ROOT: /app/story-packs
      # 生产不要用服主 Key 顶玩家：保持默认（production 下不允许 env 回退）
      # LLM_ALLOW_ENV_FALLBACK: 'false'
    volumes:
      - ./story-packs:/app/story-packs
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      args:
        # 浏览器访问宿主机上的后端端口
        NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:4400
    container_name: ocraft-client
    depends_on:
      - server
    ports:
      # 只绑定回环地址，避免服务对局域网开放
      - '127.0.0.1:3300:3300'
    environment:
      NODE_ENV: production
    restart: unless-stopped

volumes:
  ocraft_pgdata:
    # 沿用早期 server/compose 的卷，避免再起一套空库
    external: true
    name: server_ocraft_pgdata
