services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocraft-postgres
    environment:
      POSTGRES_USER: ocraft
      POSTGRES_PASSWORD: ocraft
      POSTGRES_DB: ocraft
    ports:
      - '5432:5432'
    volumes:
      - ocraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ocraft -d ocraft']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ocraft_pgdata:
