# 仅 PostgreSQL（旧命令兼容）。全栈请在仓库根目录：
#   docker compose up --build
#
# 本文件保留给：cd server && docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocraft-postgres
    environment:
      POSTGRES_USER: ocraft
      POSTGRES_PASSWORD: ocraft
      POSTGRES_DB: ocraft
    ports:
      - '15432:5432'
    volumes:
      - ocraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ocraft -d ocraft']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ocraft_pgdata:
    # 与根目录 compose 同一旧卷
    external: true
    name: server_ocraft_pgdata
